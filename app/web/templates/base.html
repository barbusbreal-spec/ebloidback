<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EbloidStore{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --accent:#3ddc84; --muted:#8a93a3; --line:#2a2f3a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
           background:var(--bg); color:#e7ebf0; }
    a { color:var(--accent); text-decoration:none; }
    header { background:var(--card); border-bottom:1px solid var(--line);
             padding:14px 20px; display:flex; align-items:center; gap:18px; }
    header .logo { font-weight:700; font-size:18px; }
    header .logo span { color:var(--accent); }
    header nav { margin-left:auto; display:flex; gap:16px; align-items:center; }
    .container { max-width:920px; margin:0 auto; padding:24px 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
            padding:18px; margin-bottom:16px; }
    .btn { display:inline-block; background:var(--accent); color:#06210f; border:none;
           padding:10px 16px; border-radius:10px; font-weight:600; cursor:pointer; }
    .btn.secondary { background:#2a2f3a; color:#e7ebf0; }
    .btn.danger { background:#e5484d; color:#fff; }
    input, textarea, select { width:100%; padding:10px 12px; border-radius:10px;
            border:1px solid var(--line); background:#11141a; color:#e7ebf0; margin-top:6px; }
    label { display:block; margin-bottom:12px; font-size:14px; color:var(--muted); }
    .muted { color:var(--muted); font-size:13px; }
    .flash { padding:12px 14px; border-radius:10px; margin-bottom:14px; }
    .flash.error { background:#3a1416; border:1px solid #e5484d; }
    .flash.ok { background:#0f2a1a; border:1px solid var(--accent); }
    .tag { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; }
    .tag.pending { background:#3a2f12; color:#f2c14e; }
    .tag.approved { background:#0f2a1a; color:var(--accent); }
    .tag.rejected { background:#3a1416; color:#e5484d; }
    .row { display:flex; gap:14px; align-items:center; }
    .icon { width:56px; height:56px; border-radius:14px; object-fit:cover; background:#11141a; }
    .shots img { height:120px; border-radius:10px; margin-right:8px; border:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; }
    td, th { text-align:left; padding:10px; border-bottom:1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <div class="logo">Ebloid<span>Store</span></div>
    <nav>{% block nav %}{% endblock %}</nav>
  </header>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
